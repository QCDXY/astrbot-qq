# 仅用于开发与测试工具配置；运行时不需要（部署使用 Docker 镜像）。
[project]
name = "astrbot-qq"
version = "1.0.0"
description = "AstrBot + NapCat QQ 聊天机器人部署项目（配置、插件与测试）"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "astrbot==4.29.1",  # 与 compose.yaml 中的镜像版本保持一致，集成测试直接运行它
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "websockets>=15.0",
  "aiohttp>=3.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: 启动真实 AstrBot 进程（使用模拟 NapCat 与模拟 LLM），较慢",
  "docker: 需要 Docker / docker compose",
]
addopts = "-ra --basetemp=.pytest_tmp"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
